name: izbrainoe
description: Личная память — файлы, заметки и пароли на своих устройствах.
publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: 2.9.0
  crypto: 3.0.8
  path_provider: 2.1.6
  path: 1.9.1
  http: 1.6.0
  file_picker: 13.3.2
  flutter_secure_storage: 11.2.0
  receive_sharing_intent: 1.9.0
  image: 4.12.0
  archive: 4.6.0
  xml: 7.1.0
  pdfx: 2.11.0
  open_filex: 5.0.0
  share_plus: 13.3.1
  url_launcher: 6.3.3
  mobile_scanner: 7.5.0
  qr_flutter: 4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
